# Render Blueprint — provisions the whole Poly_Tracker stack in one Apply:
#   - a managed Postgres (PostGIS enabled via the one-time db:init step)
#   - the Dockerized Express API
#   - the static Vite PWA frontend
#
# Deploy: connect the GitHub repo in Render → "New +" → "Blueprint" → pick this
# file → Apply. Then set the two secrets marked `sync: false` and run the
# one-time schema init. Full walkthrough in DEPLOY.md.

# PT22 (2026-08-18): the Postgres is NO LONGER on Render. Render's free Postgres
# has a hard ~30-day delete clock that a keepalive cannot stop, and it fired —
# the original `poly-tracker-db` was deleted and the API began returning
# `getaddrinfo ENOTFOUND dpg-…` while /api/health still reported {ok:true}.
#
# The database now lives in the existing free Supabase project, in a dedicated
# `poly` schema owned by a `poly_app` role that is scoped to that schema only
# (it cannot read Our_Menu's tables). No hard expiry, and OM36's keepalive
# already keeps that project awake.
#
# DATABASE_URL must use the Supabase POOLER host, not `db.<ref>.supabase.co` —
# the direct host is IPv6-only and Render's free tier is IPv4-only outbound.
# Session mode (port 5432) is required so the role's search_path persists.

services:
  # --- API: Dockerized Express + node-postgres ---
  # NOTE: *.onrender.com is a GLOBAL namespace across all Render users, so
  # plain "poly-tracker" is already taken. These distinctive names avoid the
  # collision; rename freely to any FREE subdomain (or add a custom domain).
  - type: web
    name: gibbhubb-poly-tracker-api
    runtime: docker
    plan: free                 # free web services cold-start after idle (~30-60s)
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api/health
    envVars:
      # Supabase pooler URL — paste in the Render dashboard, never commit it.
      # Shape: postgresql://poly_app.<project-ref>:<pw>@aws-1-eu-west-1.pooler.supabase.com:5432/postgres
      #
      # ⚠️ Do NOT append `?sslmode=require`. pg's connection-string parser then
      # builds its own verifying TLS config, which overrides the
      # `ssl: { rejectUnauthorized: false }` in api/src/db.ts and the API dies with
      # SELF_SIGNED_CERT_IN_CHAIN. TLS is switched on by PGSSL=true below.
      # Verified 2026-08-18: with sslmode → 503; without → 200 {"ok":true,"db":"up"}.
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"          # Supabase requires TLS; do NOT flip this to false
      - key: NODE_ENV
        value: production
      - key: PHOTO_STORAGE_PATH
        value: /data/photos     # ephemeral without a paid disk — geometry/PDF are the demo surface
      # PT23 — the write gate. Render generates the value on Apply; copy it out
      # of the dashboard once and paste it into the SPA (Settings → API token),
      # which keeps it in localStorage. It is deliberately NOT a VITE_* build
      # var: anything Vite bakes in ships inside the public bundle, so a token
      # published that way protects nothing.
      #
      # With NODE_ENV=production and this unset, every POST/PATCH/DELETE now
      # answers 503 rather than succeeding — the deployment fails closed. Reads
      # stay open on purpose (no API_READ_TOKEN); the map is meant to be viewable.
      - key: API_WRITE_TOKEN
        generateValue: true

  # --- Web: static Vite PWA ---
  - type: web
    name: gibbhubb-poly-tracker
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    envVars:
      # Points the SPA at the API's public URL. Left unset here on purpose:
      # you can't know the API's final hostname until it deploys (names may get
      # a suffix). After the first deploy, set this to the API service's real
      # URL + "/api" (e.g. https://gibbhubb-poly-tracker-api.onrender.com/api)
      # and redeploy the web service — Vite bakes env at build time. See DEPLOY.md.
      - key: VITE_API_BASE
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false             # secret — paste the pk.… token in the Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
