name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: poly_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/poly_tracker_test
      PHOTO_STORAGE_PATH: /tmp/poly_tracker_photos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      # Web
      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Web typecheck
        run: npm run typecheck
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      # API
      - name: Install api deps
        run: npm ci
        working-directory: api

      - name: API typecheck
        run: npm run typecheck
        working-directory: api

      - name: API build
        run: npm run build
        working-directory: api

      - name: API tests
        run: npm run test:run
        working-directory: api
