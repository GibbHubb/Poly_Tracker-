# Production: serve the built SPA statically and proxy /api to the api
# container. Single origin so the service worker can cache same-origin
# /api GETs + tiles. Baked into the web image's `prod` stage.
#
# PT48 — the SPA's security headers, the same set and values vercel.json sends
# (PT43). web/src/lib/nginxHeaders.test.ts fails if the two drift, so change
# them in both. They are repeated in each SPA location on purpose:
#   - nginx drops EVERY inherited add_header in a location that has one of its
#     own, so server-level headers would vanish from /sw.js (Cache-Control);
#   - /api/ must not get them: the API sends its own deny-all CSP
#     (api/src/middleware/securityHeaders.ts), never both on one response.
# `always` so 404s and errors carry them too.
upstream api_srv {
    server api:3001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api_srv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Never cache the service worker so updates roll out immediately
    # (precached assets are content-hashed and cached normally).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com https://server.arcgisonline.com https://spatial-img.information.qld.gov.au https://*.supabase.co; connect-src 'self' https://api.mapbox.com https://server.arcgisonline.com https://spatial-img.information.qld.gov.au https://nominatim.openstreetmap.org https://*.supabase.co; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /sw.js =404;
    }

    # SPA fallback: client-side routes (e.g. /farms/<id>) → index.html.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com https://server.arcgisonline.com https://spatial-img.information.qld.gov.au https://*.supabase.co; connect-src 'self' https://api.mapbox.com https://server.arcgisonline.com https://spatial-img.information.qld.gov.au https://nominatim.openstreetmap.org https://*.supabase.co; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
