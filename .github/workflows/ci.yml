name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: poly_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/poly_tracker_test
      PHOTO_STORAGE_PATH: /tmp/poly_tracker_photos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # PT36 — 22, not 20: Node 20 has no global `navigator`, so photoQueue's
          # tests (PT28, written and run on Node 22) crashed the moment the web
          # suite first ran in CI. 22 also matches the dev machines; 20 is EOL.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      # Web
      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Web typecheck
        run: npm run typecheck
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      # PT36 — the web suite (offline queue, conflict merge, Dexie upgrade,
      # geometry) with a coverage floor that only ratchets up (vitest.config.ts).
      - name: Web tests + coverage floor
        run: npm run test:coverage
        working-directory: web

      # PT32 — no emitted script over 700 kB (scripts/check-bundle-budget.mjs).
      - name: Web bundle budget
        run: npm run check:bundle
        working-directory: web

      # API
      - name: Install api deps
        run: npm ci
        working-directory: api

      - name: API typecheck
        run: npm run typecheck
        working-directory: api

      - name: API build
        run: npm run build
        working-directory: api

      - name: API tests
        run: npm run test:run
        working-directory: api
