name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: poly_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/poly_tracker_test
      PHOTO_STORAGE_PATH: /tmp/poly_tracker_photos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # PT36 — 22, not 20: Node 20 has no global `navigator`, so photoQueue's
          # tests (PT28, written and run on Node 22) crashed the moment the web
          # suite first ran in CI. 22 also matches the dev machines; 20 is EOL.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      # Web
      - name: Install web deps
        run: npm ci
        working-directory: web

      # PT43 — dependency scanning. Fails on any high/critical advisory that is
      # not on the reviewed allowlist (scripts/audit-allowlist.json: reason,
      # ticket, review-by date). Plain `npm audit --audit-level=high` would be
      # red from day one on fixes that need breaking majors; see the script.
      - name: Web dependency audit
        run: node ../scripts/audit-gate.mjs
        working-directory: web

      - name: Web typecheck
        run: npm run typecheck
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      # PT36 — the web suite (offline queue, conflict merge, Dexie upgrade,
      # geometry) with a coverage floor that only ratchets up (vitest.config.ts).
      - name: Web tests + coverage floor
        run: npm run test:coverage
        working-directory: web

      # PT32 — no emitted script over 700 kB (scripts/check-bundle-budget.mjs).
      - name: Web bundle budget
        run: npm run check:bundle
        working-directory: web

      # PT48 — the self-hosted path (docker-compose.prod.yml) serves the SPA from
      # web/nginx.prod.conf. Nothing exercised it, which is how it missed PT43's
      # headers. nginx must accept the config, and the running server must send
      # vercel.json's headers (web/src/lib/nginxHeaders.test.ts checks the text).
      # No api container: /api/ answers 502, the error path `always` is for.
      - name: Self-hosted nginx config + headers
        run: |
          mkdir -p /tmp/nginx-html
          echo '<!doctype html><title>stub</title>' > /tmp/nginx-html/index.html
          echo '// stub' > /tmp/nginx-html/sw.js
          conf="$PWD/web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro"
          docker run --rm --add-host api:127.0.0.1 -v "$conf" nginx:1.27-alpine nginx -t
          docker run -d --name nginx-pt48 --add-host api:127.0.0.1 -p 8088:80 \
            -v "$conf" -v /tmp/nginx-html:/usr/share/nginx/html:ro nginx:1.27-alpine
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8088/ && break; sleep 1; done
          node scripts/check-nginx-headers.mjs http://localhost:8088

      # API
      - name: Install api deps
        run: npm ci
        working-directory: api

      - name: API dependency audit (PT43)
        run: node ../scripts/audit-gate.mjs
        working-directory: api

      - name: API typecheck
        run: npm run typecheck
        working-directory: api

      - name: API build
        run: npm run build
        working-directory: api

      - name: API tests
        run: npm run test:run
        working-directory: api
